# 看门狗配置：守护哪些服务（1=监控并自动重启，0=跳过）
#
# 常用组合：
#   全部监控（Tailscale 隧道）  → DSH=1  BRIDGE=1  WATCH_TUNNEL=tailscale
#   全部监控（Cloudflare 隧道） → DSH=1  BRIDGE=1  WATCH_TUNNEL=cloudflare
#   双隧道（两个都开）          → DSH=1  BRIDGE=1  WATCH_TUNNEL=both
#   只监控桥接（本地访问，无隧道）→ DSH=0  BRIDGE=1  WATCH_TUNNEL=none
#   只监控隧道                  → DSH=0  BRIDGE=0  WATCH_TUNNEL=cloudflare

DSH=1
BRIDGE=1
# WATCH_TUNNEL：tailscale / cloudflare / both / none（none = 不守护隧道）
WATCH_TUNNEL=cloudflare
